[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-human-asr"
version = "0.1.0"
description = "Qwen3 ASR HTTP service on Apple Silicon"
requires-python = ">=3.10"
dependencies = [
    "mlx-audio[stt]==0.5.0",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.22",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
digital-human-asr = "asr_api:main"

[tool.setuptools]
py-modules = ["asr_api", "asr_audio"]
